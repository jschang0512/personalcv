<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.author }}</title>
<meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{% if page.cover %}{% include media-url.html path=page.cover %}<meta property="og:image" content="{{ media_abs }}">{% endif %}
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.author }} · Blog" href="{{ '/blog/feed.xml' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,400&family=Noto+Serif+TC:wght@500;600&family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/blog.css' | relative_url }}">
<script>
  // Apply saved theme / language before paint (shared with the CV page)
  (function(){
    try{
      var r = document.documentElement;
      if(localStorage.getItem('cv-theme') === 'dark'){ r.setAttribute('data-theme', 'dark'); }
      var l = localStorage.getItem('cv-lang');
      if(l === 'zh' || l === 'en' || l === 'ja'){ r.setAttribute('data-lang', l); }
    }catch(e){}
  })();
</script>
{% if page.math %}
<script>window.MathJax = { tex: { inlineMath: [['\\(', '\\)']] } };</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
{% endif %}
