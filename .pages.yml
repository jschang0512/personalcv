# Pages CMS configuration — https://pagescms.org
# Log in at https://app.pagescms.org with GitHub, open this repo, and edit "網站內容".
# Multilingual fields have 中文 / English / 日本語; leave English or 日本語 empty to reuse 中文.
# Generated without components so every list shows an "Add" button.
media:
  - name: images
    input: media
    output: /personalcv/media
    extensions: [jpg, jpeg, png, webp, gif, svg, mp4, webm, pdf, pptx, docx, xlsx, csv, zip]
    rename: safe
content:
  - name: site
    label: "網站內容"
    type: file
    path: content.json
    format: json
    fields:
      - name: profile
        label: "個人資料"
        type: object
        fields:
          - name: name
            label: "姓名"
            type: object
            fields:
              - name: zh
                label: "中文"
                type: string
              - name: en
                label: English
                type: string
              - name: ja
                label: "日本語"
                type: string
          - name: subtitle
            label: "姓名下方副標"
            type: object
            fields:
              - name: zh
                label: "中文"
                type: string
              - name: en
                label: English
                type: string
              - name: ja
                label: "日本語"
                type: string
          - name: badge
            label: "姓名上方標籤"
            type: object
            fields:
              - name: zh
                label: "中文"
                type: string
              - name: en
                label: English
                type: string
              - name: ja
                label: "日本語"
                type: string
          - name: pitch
            label: "一句話介紹"
            description: "用 **文字** 標示要以強調色顯示的字"
            type: object
            fields:
              - name: zh
                label: "中文"
                type: text
              - name: en
                label: English
                type: text
              - name: ja
                label: "日本語"
                type: text
          - name: photo
            label: "大頭照"
            type: image
            options:
              media: images
              path: media/profile
              extensions: [jpg, jpeg, png, webp, gif, svg]
          - name: email
            label: "Email（按「聯絡我」會複製）"
            type: string
          - name: orcid
            label: "ORCID 網址"
            type: string
          - name: linkedin
            label: "LinkedIn 網址"
            type: string
          - name: toolkit
            label: "小工具網址（留空則不顯示）"
            type: string
      - name: stats
        label: "數字卡（最多 4 張）"
        type: object
        list:
          max: 4
          collapsible:
            collapsed: false
            summary: "{value}"
        fields:
          - name: value
            label: "大字"
            type: string
          - name: label
            label: "標題"
            type: object
            fields:
              - name: zh
                label: "中文"
                type: string
              - name: en
                label: English
                type: string
              - name: ja
                label: "日本語"
                type: string
          - name: detail
            label: "說明"
            type: object
            fields:
              - name: zh
                label: "中文"
                type: string
              - name: en
                label: English
                type: string
              - name: ja
                label: "日本語"
                type: string
